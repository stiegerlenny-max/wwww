name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbil-client-gold-scroll-fixed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Mod Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: pbil-client-gold-scroll
          path: pbil-client-gold-scroll-fixed/build/libs/*.jar
